services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pahamin_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pahamin
      POSTGRES_PASSWORD: pahamin123
      POSTGRES_DB: pahamin_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pahamin -d pahamin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # PahamIn Backend API
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pahamin_api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: "postgresql://pahamin:pahamin123@db:5432/pahamin_db?schema=public"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
