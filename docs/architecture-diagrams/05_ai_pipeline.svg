<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Pipeline Generasi AI</text>

  <!-- Top row: general pipeline -->
  <g font-size="12" text-anchor="middle">
    <rect x="10" y="55" width="115" height="55" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="67" y="86" fill="#1E293B" font-weight="600">Konteks Guru</text>

    <rect x="140" y="55" width="120" height="55" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="200" y="78" fill="#1E293B" font-weight="600" font-size="11">Konfigurasi</text>
    <text x="200" y="93" fill="#1E293B" font-weight="600" font-size="11">Project</text>

    <rect x="275" y="55" width="120" height="55" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="335" y="78" fill="#1E293B" font-weight="600" font-size="11">Permintaan</text>
    <text x="335" y="93" fill="#1E293B" font-weight="600" font-size="11">Generate</text>

    <rect x="410" y="55" width="120" height="55" rx="9" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="470" y="78" fill="#1E293B" font-weight="600" font-size="11">Celery Worker</text>
    <text x="470" y="93" fill="#7C2D12" font-size="10">(async)</text>

    <rect x="545" y="55" width="130" height="55" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="610" y="78" fill="#1E293B" font-weight="600" font-size="11">AI Provider</text>
    <text x="610" y="93" fill="#7F1D1D" font-size="10">Gemini (eksternal)</text>

    <rect x="690" y="55" width="130" height="55" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="755" y="78" fill="#1E293B" font-weight="600" font-size="11">Output Terstruktur</text>
    <text x="755" y="93" fill="#065F46" font-size="10">(JSON)</text>

    <rect x="835" y="55" width="150" height="55" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="910" y="78" fill="#1E293B" font-weight="600" font-size="11">Validasi Pydantic</text>
    <text x="910" y="93" fill="#475569" font-size="10">strict schema</text>
  </g>
  <g>
    <line x1="125" y1="82" x2="136" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="260" y1="82" x2="271" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="395" y1="82" x2="406" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="530" y1="82" x2="541" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="675" y1="82" x2="686" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="820" y1="82" x2="831" y2="82" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <line x1="910" y1="110" x2="910" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="135" text-anchor="end" font-size="11" fill="#475569">gagal &#8594; status=error</text>

  <!-- Section divider -->
  <text x="30" y="180" font-size="13" font-weight="700" fill="#0F172A">Detail khusus Presentasi: keputusan visual &amp; aset gambar</text>
  <line x1="0" y1="192" x2="1000" y2="192" stroke="#E2E8F0" stroke-width="2"/>

  <g font-size="12" text-anchor="middle">
    <rect x="30" y="215" width="150" height="55" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="105" y="238" fill="#1E293B" font-weight="600" font-size="11">PresentationArtifact</text>
    <text x="105" y="253" fill="#065F46" font-size="10">tervalidasi</text>

    <rect x="210" y="215" width="180" height="55" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="300" y="234" fill="#1E293B" font-weight="600" font-size="11">Visual Decision Layer</text>
    <text x="300" y="249" fill="#475569" font-size="10">deterministik: type=="visual"?</text>
    <text x="300" y="262" fill="#475569" font-size="10">(bukan keputusan AI)</text>

    <rect x="420" y="215" width="150" height="55" rx="9" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="495" y="234" fill="#1E293B" font-weight="600" font-size="11">Image Generation</text>
    <text x="495" y="249" fill="#7F1D1D" font-size="10">Pollinations.ai (default),</text>
    <text x="495" y="262" fill="#7F1D1D" font-size="10">Gemini image, HuggingFace</text>

    <rect x="600" y="215" width="150" height="55" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="675" y="234" fill="#1E293B" font-weight="600" font-size="11">Storage Service</text>
    <text x="675" y="249" fill="#475569" font-size="10">Local FS atau</text>
    <text x="675" y="262" fill="#475569" font-size="10">Supabase Storage</text>

    <rect x="780" y="215" width="200" height="55" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="880" y="234" fill="#1E293B" font-weight="600" font-size="11">Artifact Final</text>
    <text x="880" y="249" fill="#065F46" font-size="10">assets[] terisi URL gambar</text>
    <text x="880" y="262" fill="#065F46" font-size="10">(re-validasi Pydantic)</text>
  </g>
  <g>
    <line x1="180" y1="242" x2="206" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="390" y1="242" x2="416" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="570" y1="242" x2="596" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="750" y1="242" x2="776" y2="242" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">Gagal generate gambar tidak fatal — slide tetap disimpan tanpa gambar (assets kosong).</text>

  <!-- Bottom: persistence + frontend -->
  <line x1="880" y1="270" x2="880" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" text-anchor="middle">
    <rect x="720" y="345" width="180" height="55" rx="9" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="810" y="368" fill="#1E293B" font-weight="600" font-size="11">GeneratedOutput</text>
    <text x="810" y="383" fill="#475569" font-size="10">status = done, content tersimpan</text>
  </g>
  <line x1="720" y1="372" x2="500" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g font-size="12" text-anchor="middle">
    <rect x="330" y="345" width="170" height="55" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="415" y="368" fill="#1E293B" font-weight="600" font-size="11">Frontend Renderer</text>
    <text x="415" y="383" fill="#475569" font-size="10">SlideRenderer, dst.</text>
  </g>

  <rect x="20" y="440" width="960" height="130" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="40" y="465" font-size="13" font-weight="700" fill="#0F172A">Pemisahan Tanggung Jawab</text>
  <text x="40" y="490" font-size="12" fill="#334155">• AI (Gemini): menyusun konten &amp; struktur pembelajaran (teks, urutan slide/soal/bab).</text>
  <text x="40" y="510" font-size="12" fill="#334155">• Backend: memvalidasi struktur (Pydantic), memutuskan &amp; mengambil aset gambar, menyimpan hasil.</text>
  <text x="40" y="530" font-size="12" fill="#334155">• Frontend: merender artifact yang sudah tervalidasi menjadi pengalaman interaktif.</text>
  <text x="40" y="552" font-size="11" fill="#64748B" font-style="italic">Prinsip: AI tidak pernah membuat URL gambar sendiri — itu langkah backend setelah teks AI selesai.</text>
</svg>
