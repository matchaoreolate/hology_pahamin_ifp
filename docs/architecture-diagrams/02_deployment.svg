<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Arsitektur Deployment</text>

  <g font-size="15" text-anchor="middle">
    <!-- Browser / IFP -->
    <rect x="330" y="55" width="240" height="55" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="450" y="88" fill="#1E293B" font-weight="600">Browser / Layar IFP Kelas</text>

    <!-- Frontend deployment -->
    <rect x="330" y="140" width="240" height="55" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="450" y="165" fill="#1E293B" font-weight="600">Frontend Deployment</text>
    <text x="450" y="182" fill="#475569" font-size="12">Static hosting (React SPA)</text>

    <!-- FastAPI -->
    <rect x="330" y="225" width="240" height="55" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="450" y="250" fill="#1E293B" font-weight="600">FastAPI Backend</text>
    <text x="450" y="267" fill="#475569" font-size="12">KelasIn — milik sendiri</text>

    <!-- Row of 3: DB, Redis, Storage -->
    <rect x="60" y="330" width="180" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="150" y="355" fill="#1E293B" font-weight="600">PostgreSQL</text>
    <text x="150" y="374" fill="#475569" font-size="12">Data relasional</text>

    <rect x="360" y="330" width="180" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="450" y="355" fill="#1E293B" font-weight="600">Redis</text>
    <text x="450" y="374" fill="#475569" font-size="12">Celery broker/backend</text>

    <rect x="660" y="330" width="180" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="750" y="355" fill="#1E293B" font-weight="600">Storage</text>
    <text x="750" y="367" fill="#475569" font-size="11">Local FS / Supabase</text>
    <text x="750" y="382" fill="#475569" font-size="11">(otomatis dipilih)</text>

    <!-- Celery worker -->
    <rect x="360" y="425" width="180" height="55" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="450" y="450" fill="#1E293B" font-weight="600">Celery Worker</text>
    <text x="450" y="467" fill="#7C2D12" font-size="12">KelasIn — milik sendiri</text>

    <!-- AI Provider -->
    <rect x="360" y="510" width="180" height="60" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="450" y="533" fill="#1E293B" font-weight="600">AI Provider</text>
    <text x="450" y="551" fill="#7F1D1D" font-size="11">Gemini, Pollinations.ai,</text>
    <text x="450" y="564" fill="#7F1D1D" font-size="11">HuggingFace (eksternal)</text>
  </g>

  <!-- arrows -->
  <line x1="450" y1="110" x2="450" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="195" x2="450" y2="221" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="380" y1="280" x2="180" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="280" x2="450" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="280" x2="720" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="450" y1="390" x2="450" y2="421" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="480" x2="450" y2="506" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- legend -->
  <g font-size="12">
    <rect x="40" y="580" width="16" height="16" fill="#EEF2FF" stroke="#4F46E5"/>
    <text x="62" y="592" fill="#334155">Komponen milik KelasIn</text>
    <rect x="240" y="580" width="16" height="16" fill="#FEE2E2" stroke="#DC2626" stroke-dasharray="4,2"/>
    <text x="262" y="592" fill="#334155">Layanan eksternal (pihak ketiga)</text>
  </g>
</svg>
