<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Arsitektur Interaksi Presentasi</text>

  <g font-size="13" text-anchor="middle">
    <rect x="340" y="55" width="220" height="50" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="450" y="85" fill="#1E293B" font-weight="600">Slide Interaktif (type="interactive")</text>

    <rect x="340" y="135" width="220" height="50" rx="9" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="450" y="165" fill="#1E293B" font-weight="600">InteractionRenderer</text>
  </g>
  <line x1="450" y1="105" x2="450" y2="131" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="185" x2="450" y2="205" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="205" x2="810" y2="205" stroke="#475569" stroke-width="2"/>

  <g font-size="11" text-anchor="middle">
    <line x1="90" y1="205" x2="90" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="270" y1="205" x2="270" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="450" y1="205" x2="450" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="630" y1="205" x2="630" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="810" y1="205" x2="810" y2="225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="230" width="120" height="45" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="90" y="257" fill="#1E293B" font-weight="600">Choice</text>

    <rect x="210" y="230" width="120" height="45" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="270" y="257" fill="#1E293B" font-weight="600">Matching</text>

    <rect x="390" y="230" width="120" height="45" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="450" y="257" fill="#1E293B" font-weight="600">Sorting</text>

    <rect x="570" y="230" width="120" height="45" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="630" y="257" fill="#1E293B" font-weight="600">Reveal</text>

    <rect x="750" y="230" width="120" height="45" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="810" y="252" fill="#1E293B" font-weight="600" font-size="11">Drag &amp; Drop</text>
  </g>

  <text x="450" y="295" text-anchor="middle" font-size="11" fill="#64748B" font-style="italic">AI memilih &amp; menyusun tipe interaksi; komponen frontend yang mengeksekusi state runtime-nya.</text>
</svg>
