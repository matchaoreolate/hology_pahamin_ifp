<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="480" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">ERD — Entitas Inti</text>

  <!-- USER -->
  <g>
    <rect x="20" y="70" width="210" height="150" rx="8" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="20" y="70" width="210" height="32" rx="8" fill="#4F46E5"/>
    <text x="125" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">USER</text>
    <text x="34" y="118" font-size="12" fill="#1E293B">id (PK)</text>
    <text x="34" y="136" font-size="12" fill="#1E293B">email (UK)</text>
    <text x="34" y="154" font-size="12" fill="#1E293B">hashed_password</text>
    <text x="34" y="172" font-size="12" fill="#1E293B">full_name</text>
    <text x="34" y="190" font-size="12" fill="#1E293B">nama_sekolah, kota</text>
    <text x="34" y="208" font-size="12" fill="#1E293B">is_active, is_verified</text>
  </g>

  <!-- LEARNING_CONTEXT -->
  <g>
    <rect x="270" y="70" width="240" height="180" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="270" y="70" width="240" height="32" rx="8" fill="#059669"/>
    <text x="390" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">LEARNING_CONTEXT</text>
    <text x="284" y="118" font-size="12" fill="#1E293B">id (PK)</text>
    <text x="284" y="136" font-size="12" fill="#1E293B">user_id (FK)</text>
    <text x="284" y="154" font-size="12" fill="#1E293B">fase, kelas</text>
    <text x="284" y="172" font-size="12" fill="#1E293B">mata_pelajaran, topik</text>
    <text x="284" y="190" font-size="12" fill="#1E293B">tujuan_pembelajaran</text>
    <text x="284" y="208" font-size="12" fill="#1E293B">alokasi_waktu_jp</text>
    <text x="284" y="226" font-size="12" fill="#1E293B">konteks_geografis, dst.</text>
  </g>

  <!-- MEDIA_PROJECT -->
  <g>
    <rect x="560" y="70" width="240" height="180" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <rect x="560" y="70" width="240" height="32" rx="8" fill="#EA580C"/>
    <text x="680" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">MEDIA_PROJECT</text>
    <text x="574" y="118" font-size="12" fill="#1E293B">id (PK)</text>
    <text x="574" y="136" font-size="12" fill="#1E293B">user_id (FK)</text>
    <text x="574" y="154" font-size="12" fill="#1E293B">learning_context_id (FK)</text>
    <text x="574" y="172" font-size="12" fill="#1E293B">title, status</text>
    <text x="574" y="190" font-size="12" fill="#1E293B">selected_outputs (jsonb)</text>
    <text x="574" y="208" font-size="12" fill="#1E293B">output_config (jsonb)</text>
    <text x="574" y="226" font-size="12" fill="#1E293B">celery_task_id</text>
  </g>

  <!-- GENERATED_OUTPUT -->
  <g>
    <rect x="840" y="70" width="150" height="180" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="840" y="70" width="150" height="32" rx="8" fill="#DC2626"/>
    <text x="915" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">GENERATED_OUTPUT</text>
    <text x="854" y="118" font-size="12" fill="#1E293B">id (PK)</text>
    <text x="854" y="136" font-size="12" fill="#1E293B">project_id (FK)</text>
    <text x="854" y="154" font-size="12" fill="#1E293B">output_type</text>
    <text x="854" y="172" font-size="12" fill="#1E293B">status</text>
    <text x="854" y="190" font-size="12" fill="#1E293B">content (jsonb)</text>
    <text x="854" y="208" font-size="12" fill="#1E293B">generated_at</text>
  </g>

  <!-- relations -->
  <line x1="230" y1="130" x2="266" y2="130" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="248" y="122" text-anchor="middle" font-size="11" fill="#475569">1..N</text>

  <line x1="230" y1="330" x2="620" y2="254" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="300" text-anchor="middle" font-size="11" fill="#475569">creates 1..N (owns)</text>

  <line x1="510" y1="160" x2="556" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="533" y="152" text-anchor="middle" font-size="11" fill="#475569">1..N</text>

  <line x1="800" y1="160" x2="836" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="152" text-anchor="middle" font-size="11" fill="#475569">1..3</text>

  <!-- conceptual chain -->
  <rect x="230" y="330" width="530" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
  <text x="495" y="365" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">User &#8594; Learning Context &#8594; Media Project &#8594; Generated Output</text>

  <text x="500" y="440" text-anchor="middle" font-size="12" fill="#64748B" font-style="italic">Hanya 4 tabel di database. Aset gambar disimpan sebagai URL di dalam GENERATED_OUTPUT.content, bukan tabel terpisah.</text>
</svg>
