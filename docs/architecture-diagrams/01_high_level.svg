<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="460" fill="#ffffff"/>

  <!-- boxes -->
  <g font-size="15" text-anchor="middle">
    <!-- Teacher -->
    <rect x="20" y="190" width="120" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="80" y="225" fill="#1E293B" font-weight="600">Guru</text>

    <!-- Frontend -->
    <rect x="180" y="190" width="150" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="255" y="215" fill="#1E293B" font-weight="600">Frontend</text>
    <text x="255" y="234" fill="#475569" font-size="12">React / Vite</text>

    <!-- FastAPI -->
    <rect x="370" y="190" width="150" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="445" y="215" fill="#1E293B" font-weight="600">FastAPI</text>
    <text x="445" y="234" fill="#475569" font-size="12">API Backend</text>

    <!-- Generation pipeline -->
    <rect x="560" y="190" width="170" height="60" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
    <text x="645" y="215" fill="#1E293B" font-weight="600">Generation Pipeline</text>
    <text x="645" y="234" fill="#7C2D12" font-size="12">Celery + Gemini AI</text>

    <!-- Structured artifact -->
    <rect x="770" y="190" width="190" height="60" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <text x="865" y="215" fill="#1E293B" font-weight="600">Structured Artifact</text>
    <text x="865" y="234" fill="#065F46" font-size="12">Presentation / LKPD / E-book</text>

    <!-- DB / Storage (below) -->
    <rect x="770" y="330" width="190" height="60" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
    <text x="865" y="355" fill="#1E293B" font-weight="600">Database / Storage</text>
    <text x="865" y="374" fill="#475569" font-size="12">PostgreSQL + File Storage</text>

    <!-- Frontend renderer (below) -->
    <rect x="370" y="330" width="290" height="60" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.5"/>
    <text x="515" y="355" fill="#1E293B" font-weight="600">Frontend Renderer</text>
    <text x="515" y="374" fill="#475569" font-size="12">Slide / Worksheet / E-book Renderer</text>

    <!-- Classroom -->
    <rect x="20" y="330" width="290" height="60" rx="10" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.5"/>
    <text x="165" y="355" fill="#1E293B" font-weight="600">Pengalaman Kelas</text>
    <text x="165" y="374" fill="#854D0E" font-size="12">Interaktif di IFP / Layar</text>
  </g>

  <!-- arrows top row -->
  <line x1="140" y1="220" x2="176" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="220" x2="366" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="220" x2="556" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="220" x2="766" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down to storage -->
  <line x1="865" y1="250" x2="865" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- storage to renderer -->
  <line x1="766" y1="360" x2="664" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- renderer to classroom -->
  <line x1="366" y1="360" x2="314" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0F172A">Alur Tingkat Tinggi Sistem KelasIn</text>
</svg>
