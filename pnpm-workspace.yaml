packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@google/genai': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@rolldown/binding-openharmony-arm64@1.2.6'
